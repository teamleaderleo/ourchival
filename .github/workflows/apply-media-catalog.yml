name: Apply media catalog patch

on:
  push:
    branches:
      - feat/media-derivatives
    paths:
      - scripts/apply-media-catalog-patch.py
      - .github/workflows/apply-media-catalog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-derivatives
      - name: Patch reference hydration
        run: python scripts/apply-media-catalog-patch.py
      - name: Commit catalog update
        run: |
          if git diff --quiet -- convex/lib/referenceCatalog.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/lib/referenceCatalog.ts
          git commit -m "feat: hydrate media derivative URLs"
          git push origin HEAD:feat/media-derivatives
