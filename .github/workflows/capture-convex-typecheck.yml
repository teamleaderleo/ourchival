name: Capture Convex typecheck diagnostics

on:
  push:
    branches:
      - feat/media-derivatives
    paths:
      - .github/workflows/capture-convex-typecheck.yml
      - convex/**
      - package.json

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-derivatives
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec tsc -p convex/tsconfig.json > CONVEX_TYPECHECK_DIAGNOSTICS.txt 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> CONVEX_TYPECHECK_DIAGNOSTICS.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONVEX_TYPECHECK_DIAGNOSTICS.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture Convex typecheck diagnostics"
          git push origin HEAD:feat/media-derivatives
