name: Retrieval workspace snapshot

on:
  push:
    branches: [codex/retrieval-enrichment]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Package tracked application source only
        run: git archive --format=tar --output=source.tar HEAD
      - name: Package test dependencies
        run: tar -czf dependencies.tar.gz node_modules apps/*/node_modules packages/*/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-workspace
          path: |
            source.tar
            dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
