<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Import links · Ourchival</title>
    <style>
      :root { color-scheme: dark; --bg:#090b10; --panel:#121720; --line:#2c3441; --text:#f3f5f9; --muted:#9aa4b3; --accent:#ad97ff; --danger:#ef8491; }
      * { box-sizing:border-box; }
      body { margin:0; background:radial-gradient(circle at 70% -10%,rgba(126,104,220,.22),transparent 32rem),var(--bg); color:var(--text); font:14px Inter,ui-sans-serif,system-ui,sans-serif; }
      main { width:min(760px,calc(100% - 32px)); margin:64px auto; display:grid; gap:18px; }
      header { display:grid; gap:7px; }
      h1,p { margin:0; } h1 { font-size:34px; letter-spacing:-.04em; } .eyebrow { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
      .lede,.hint { color:var(--muted); line-height:1.55; }
      section { display:grid; gap:16px; border:1px solid var(--line); border-radius:18px; padding:22px; background:rgba(18,23,32,.96); }
      label { display:grid; gap:7px; font-weight:700; } select,input,button { font:inherit; }
      select,input[type=file] { width:100%; border:1px solid var(--line); border-radius:11px; padding:12px; background:#0b0e13; color:var(--text); }
      button { min-height:44px; border:1px solid rgba(173,151,255,.55); border-radius:11px; padding:10px 16px; background:var(--accent); color:#0b0912; cursor:pointer; font-weight:800; }
      button.secondary { background:rgba(173,151,255,.12); color:#cbbfff; } button:disabled { cursor:default; opacity:.45; }
      .actions { display:flex; gap:10px; flex-wrap:wrap; } .actions button { flex:1; }
      .counts { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; } .counts div { border:1px solid var(--line); border-radius:11px; padding:10px; color:var(--muted); } .counts strong { display:block; color:var(--text); font-size:20px; }
      progress { width:100%; accent-color:var(--accent); } .error { color:var(--danger); }
      @media(max-width:600px){ main{margin:28px auto}.counts{grid-template-columns:repeat(2,1fr)}h1{font-size:28px} }
    </style>
  </head>
  <body><main id="root"></main><script type="module" src="./import.js"></script></body>
</html>
