<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ourchival</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 390px;
        margin: 0;
        padding: 16px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #11100e;
        color: #f3eadf;
      }

      header {
        margin-bottom: 16px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #b8aa9a;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0;
        font-size: 24px;
      }

      h2 {
        margin-bottom: 8px;
        font-size: 14px;
      }

      form,
      section {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
        padding: 12px;
        background: #1b1916;
        border: 1px solid #3a332d;
        border-radius: 16px;
      }

      label {
        color: #b8aa9a;
        font-size: 12px;
      }

      input {
        width: 100%;
        border: 1px solid #3a332d;
        border-radius: 10px;
        padding: 10px;
        background: #11100e;
        color: #f3eadf;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 12px;
        background: #f3eadf;
        color: #11100e;
        font-weight: 700;
        cursor: pointer;
      }

      .hint,
      .status p {
        margin: 0;
        color: #b8aa9a;
        font-size: 12px;
        line-height: 1.4;
      }

      .status.ok {
        border-color: #5f7f54;
      }

      .status.duplicate {
        border-color: #8a7359;
      }

      .receipt {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        padding: 10px;
        background: #11100e;
        border: 1px solid #3a332d;
        border-radius: 12px;
      }

      .receipt strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }

      .receipt p {
        margin: 3px 0 0;
        color: #b8aa9a;
        font-size: 11px;
      }

      .receipt-kind {
        padding: 5px 7px;
        border-radius: 999px;
        background: #2b261f;
        color: #d8b792;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      details {
        color: #b8aa9a;
        font-size: 11px;
      }

      summary {
        cursor: pointer;
      }

      pre {
        white-space: pre-wrap;
        background: #11100e;
        border: 1px solid #3a332d;
        border-radius: 12px;
        padding: 12px;
        max-height: 150px;
        overflow: auto;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
