<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ourchival</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #11151c;
        --panel-raised: #171c25;
        --text: #f3f5f9;
        --muted: #929ba9;
        --line: #2a313d;
        --accent: #ad97ff;
        --accent-strong: #cbbfff;
        --accent-soft: rgba(173, 151, 255, 0.13);
        --success: #73d6a0;
        --danger: #ef8491;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 420px;
        max-height: 590px;
        margin: 0;
        overflow-y: auto;
        padding: 14px;
        background:
          radial-gradient(
            circle at 76% -18%,
            rgba(126, 104, 220, 0.18),
            transparent 19rem
          ),
          var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        display: grid;
        gap: 10px;
      }
      main.pairing-view {
        gap: 14px;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      .file-button:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .popup-header {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 3px 2px 6px;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: none;
        place-items: center;
        border: 1px solid rgba(173, 151, 255, 0.5);
        border-radius: 12px;
        background:
          linear-gradient(
            145deg,
            rgba(173, 151, 255, 0.22),
            rgba(173, 151, 255, 0.04)
          ),
          var(--panel);
        color: var(--accent-strong);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
      }

      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        margin-top: 2px;
        font-size: 20px;
        letter-spacing: -0.035em;
      }
      h2 {
        font-size: 13px;
        letter-spacing: -0.012em;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      section,
      details {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel), transparent 3%);
      }

      section {
        display: grid;
        gap: 10px;
        padding: 12px;
      }
      details {
        padding: 10px 12px;
      }
      summary {
        color: #bcc3ce;
        cursor: pointer;
        font-size: 12px;
        font-weight: 680;
      }
      details[open] summary {
        margin-bottom: 10px;
      }

      .section-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .section-heading > div {
        display: grid;
        gap: 3px;
      }
      .section-heading.compact {
        align-items: center;
      }
      .section-heading time {
        color: var(--muted);
        font-size: 10px;
      }

      .endpoint-state {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 7px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 740;
        text-transform: uppercase;
      }

      .endpoint-state.ready {
        border-color: rgba(115, 214, 160, 0.4);
        color: var(--success);
      }
      .action-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .import-actions,
      .batch-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }
      .batch-actions:empty {
        display: none;
      }
      .details-stack {
        display: grid;
        gap: 10px;
      }

      button,
      .file-button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        background: var(--panel-raised);
        color: #dce1e8;
        cursor: pointer;
        font-size: 11px;
        font-weight: 720;
        text-align: center;
      }

      button:hover:not(:disabled),
      .file-button:hover:not(.disabled) {
        border-color: #465063;
        background: #1c2330;
      }
      button.primary {
        border-color: rgba(173, 151, 255, 0.55);
        background: var(--accent);
        color: #0b0912;
      }
      button.secondary,
      .file-button {
        border-color: rgba(173, 151, 255, 0.42);
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      button:disabled,
      .file-button.disabled {
        cursor: default;
        opacity: 0.42;
      }
      .full-width {
        width: 100%;
      }
      .file-button {
        position: relative;
        display: grid;
        place-items: center;
      }
      .file-button input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      form {
        display: grid;
        gap: 8px;
      }
      label {
        color: #b9c0cb;
        font-size: 11px;
        font-weight: 650;
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        background: #0b0e13;
        color: var(--text);
        font-size: 11px;
      }
      textarea {
        resize: vertical;
        line-height: 1.45;
      }
      input::placeholder,
      textarea::placeholder {
        color: #66707f;
      }

      .hint,
      .status-panel p,
      .current-item {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
      }

      .pairing-panel {
        gap: 14px;
        border-color: rgba(173, 151, 255, 0.38);
        padding: 16px;
        background:
          linear-gradient(155deg, var(--accent-soft), transparent 58%),
          var(--panel);
      }
      .pairing-panel h2 {
        font-size: 15px;
      }
      .pairing-panel form {
        gap: 9px;
      }
      .pairing-panel button.primary {
        min-height: 42px;
        margin-top: 3px;
        font-size: 12px;
      }
      .pairing-intro {
        color: #c7cdd6;
        font-size: 11px;
        line-height: 1.5;
      }

      .status-panel.ok {
        border-color: rgba(115, 214, 160, 0.38);
      }
      .status-panel.error {
        border-color: rgba(239, 132, 145, 0.38);
      }
      .batch-panel.running {
        border-color: rgba(173, 151, 255, 0.46);
      }
      .batch-panel.complete {
        border-color: rgba(115, 214, 160, 0.3);
      }

      .progress-track {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #080a0e;
      }
      .progress-track span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8c75e8, var(--accent-strong));
        transition: width 180ms ease;
      }
      .current-item {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .batch-counts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .batch-counts span {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 7px 4px;
        color: var(--muted);
        font-size: 9px;
        text-align: center;
      }
      .batch-counts strong {
        display: block;
        margin-bottom: 2px;
        color: var(--text);
        font-size: 13px;
      }

      .failure-details {
        padding: 0;
        border: 0;
        background: transparent;
      }
      .failure-details summary {
        color: var(--danger);
      }
      .failure-details ul {
        display: grid;
        gap: 7px;
        max-height: 150px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .failure-details li {
        display: grid;
        gap: 2px;
        border-top: 1px solid var(--line);
        padding-top: 7px;
      }
      .failure-details li span {
        overflow: hidden;
        color: #c4cad4;
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .failure-details li small {
        color: var(--danger);
        font-size: 9px;
      }

      .settings-panel form {
        margin-top: 2px;
      }
      pre {
        max-height: 180px;
        overflow: auto;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px;
        background: #080a0e;
        color: #b8c0cb;
        font-size: 9px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
